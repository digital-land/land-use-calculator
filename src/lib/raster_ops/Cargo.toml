[package]
name = "raster_ops"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
js-sys = "0.3.81"
wasm-bindgen = "0.2"

[features]
# Default feature set — no threads or simd required
default = []
# Optional feature for threaded and SIMD builds
simd = []
threads = []

[profile.release]
opt-level = "s"
lto = true

